<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語テキスト読み上げ</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4a90d9;
            --primary-hover: #357abd;
            --secondary-color: #6c757d;
            --secondary-hover: #545b62;
            --success-color: #28a745;
            --success-hover: #1e7e34;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        main {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .input-section {
            margin-bottom: 1.5rem;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        textarea {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
        }

        .char-count {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .settings-section {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--background);
            border-radius: 8px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .setting-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        select {
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .controls-section {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--secondary-hover);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: var(--success-hover);
        }

        .status {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .status.info {
            display: block;
            background: #e7f3ff;
            color: #0066cc;
        }

        .status.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        .status.warning {
            display: block;
            background: #fff3cd;
            color: #856404;
        }

        .recording-progress {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--background);
            border-radius: 8px;
        }

        .recording-progress.hidden {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.1s linear;
        }

        #recording-status {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .controls-section {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        .btn-primary.speaking {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Audio player for downloaded audio */
        .audio-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--background);
            border-radius: 8px;
        }

        .audio-section.hidden {
            display: none;
        }

        .audio-section h3 {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .audio-section audio {
            width: 100%;
            margin-bottom: 0.75rem;
        }

        .audio-actions {
            display: flex;
            gap: 0.5rem;
        }

        .audio-actions .btn {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ 日本語テキスト読み上げ</h1>
            <p class="subtitle">テキストを入力して、自然な日本語音声で再生・ダウンロード</p>
        </header>

        <main>
            <div class="input-section">
                <label for="text-input">読み上げるテキスト</label>
                <textarea
                    id="text-input"
                    placeholder="ここにテキストを入力してください..."
                    rows="6"
                >こんにちは。これはテキスト読み上げアプリのサンプルです。</textarea>
                <div class="char-count">
                    <span id="char-count">0</span> 文字
                </div>
            </div>

            <div class="settings-section">
                <div class="setting-group">
                    <label for="voice-select">音声</label>
                    <select id="voice-select">
                        <option value="">音声を読み込み中...</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="rate-slider">速度: <span id="rate-value">1.0</span>x</label>
                    <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
                </div>

                <div class="setting-group">
                    <label for="pitch-slider">ピッチ: <span id="pitch-value">1.0</span></label>
                    <input type="range" id="pitch-slider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>

            <div class="controls-section">
                <button id="play-btn" class="btn btn-primary">
                    ▶️ 再生
                </button>
                <button id="stop-btn" class="btn btn-secondary" disabled>
                    ⏹️ 停止
                </button>
            </div>

            <div id="status" class="status"></div>

            <!-- 生成された音声セクション -->
            <div id="audio-section" class="audio-section hidden">
                <h3>🔊 生成された音声</h3>
                <audio id="audio-player" controls></audio>
                <div class="audio-actions">
                    <a id="download-link" class="btn btn-success" download="speech.wav">
                        💾 ダウンロード
                    </a>
                </div>
            </div>
        </main>

        <footer>
            <p>Web Speech API を使用しています</p>
        </footer>
    </div>

    <script>
        // 日本語テキスト読み上げアプリ
        class TextToSpeechApp {
            constructor() {
                this.textInput = document.getElementById('text-input');
                this.voiceSelect = document.getElementById('voice-select');
                this.rateSlider = document.getElementById('rate-slider');
                this.rateValue = document.getElementById('rate-value');
                this.pitchSlider = document.getElementById('pitch-slider');
                this.pitchValue = document.getElementById('pitch-value');
                this.playBtn = document.getElementById('play-btn');
                this.stopBtn = document.getElementById('stop-btn');
                this.charCount = document.getElementById('char-count');
                this.status = document.getElementById('status');
                this.audioSection = document.getElementById('audio-section');
                this.audioPlayer = document.getElementById('audio-player');
                this.downloadLink = document.getElementById('download-link');

                this.synth = window.speechSynthesis;
                this.voices = [];
                this.currentUtterance = null;

                this.init();
            }

            init() {
                this.loadVoices();

                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = () => this.loadVoices();
                }

                this.textInput.addEventListener('input', () => this.updateCharCount());
                this.rateSlider.addEventListener('input', () => this.updateRateDisplay());
                this.pitchSlider.addEventListener('input', () => this.updatePitchDisplay());
                this.playBtn.addEventListener('click', () => this.speak());
                this.stopBtn.addEventListener('click', () => this.stop());

                this.updateCharCount();
                this.updateRateDisplay();
                this.updatePitchDisplay();

                if (!('speechSynthesis' in window)) {
                    this.showStatus('このブラウザはWeb Speech APIに対応していません。', 'error');
                    this.playBtn.disabled = true;
                }

                // iOS Safari workaround - 初回タップで音声を有効化
                document.addEventListener('touchstart', () => {
                    if (this.synth) {
                        const utterance = new SpeechSynthesisUtterance('');
                        this.synth.speak(utterance);
                    }
                }, { once: true });
            }

            loadVoices() {
                this.voices = this.synth.getVoices();

                const japaneseVoices = this.voices.filter(voice =>
                    voice.lang.startsWith('ja') || voice.lang.startsWith('jp')
                );

                this.voiceSelect.innerHTML = '';

                if (japaneseVoices.length > 0) {
                    japaneseVoices.forEach((voice, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `${voice.name} (${voice.lang})`;
                        this.voiceSelect.appendChild(option);
                    });
                    this.voices = japaneseVoices;
                } else if (this.voices.length > 0) {
                    this.voices.forEach((voice, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `${voice.name} (${voice.lang})`;
                        this.voiceSelect.appendChild(option);
                    });
                    this.showStatus('日本語音声が見つかりませんでした。', 'warning');
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'デフォルト音声';
                    this.voiceSelect.appendChild(option);
                }
            }

            updateCharCount() {
                const count = this.textInput.value.length;
                this.charCount.textContent = count;
            }

            updateRateDisplay() {
                this.rateValue.textContent = this.rateSlider.value;
            }

            updatePitchDisplay() {
                this.pitchValue.textContent = this.pitchSlider.value;
            }

            createUtterance(text) {
                const utterance = new SpeechSynthesisUtterance(text);

                const selectedIndex = parseInt(this.voiceSelect.value);
                if (!isNaN(selectedIndex) && this.voices[selectedIndex]) {
                    utterance.voice = this.voices[selectedIndex];
                }

                utterance.rate = parseFloat(this.rateSlider.value);
                utterance.pitch = parseFloat(this.pitchSlider.value);
                utterance.lang = 'ja-JP';

                return utterance;
            }

            speak() {
                const text = this.textInput.value.trim();

                if (!text) {
                    this.showStatus('テキストを入力してください。', 'warning');
                    return;
                }

                this.synth.cancel();

                const utterance = this.createUtterance(text);
                this.currentUtterance = utterance;

                utterance.onstart = () => {
                    this.playBtn.classList.add('speaking');
                    this.playBtn.textContent = '🔊 再生中...';
                    this.stopBtn.disabled = false;
                    this.showStatus('再生中...', 'info');
                };

                utterance.onend = () => {
                    this.playBtn.classList.remove('speaking');
                    this.playBtn.textContent = '▶️ 再生';
                    this.stopBtn.disabled = true;
                    this.showStatus('再生完了', 'success');
                };

                utterance.onerror = (event) => {
                    console.error('Speech synthesis error:', event);
                    this.playBtn.classList.remove('speaking');
                    this.playBtn.textContent = '▶️ 再生';
                    this.stopBtn.disabled = true;

                    if (event.error !== 'interrupted') {
                        this.showStatus(`エラー: ${event.error}`, 'error');
                    }
                };

                this.synth.speak(utterance);
            }

            stop() {
                this.synth.cancel();
                this.playBtn.classList.remove('speaking');
                this.playBtn.textContent = '▶️ 再生';
                this.stopBtn.disabled = true;
                this.showStatus('停止しました', 'info');
            }

            showStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;

                if (type === 'success' || type === 'info') {
                    setTimeout(() => {
                        if (this.status.textContent === message) {
                            this.status.className = 'status';
                        }
                    }, 3000);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new TextToSpeechApp();
        });
    </script>
</body>
</html>
